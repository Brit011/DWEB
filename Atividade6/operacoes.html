<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Operações Matemáticas</title>
</head>
<body>

    <h2>Exercício 2 - Operações</h2>
    <button onclick="operacoes()">Fazer Operações</button>

    <script>
        function operacoes() {
            if (confirm("Deseja calcular as operações?")) {
                let n1 = parseFloat(prompt("Digite o primeiro número:"));
                let n2 = parseFloat(prompt("Digite o segundo número:"));

                let soma = n1 + n2;
                let sub = n1 - n2;
                let mult = n1 * n2;
                let div = n1 / n2;
                let resto = n1 % n2;

                alert(
                    "Soma: " + soma + "\n" +
                    "Subtração: " + sub + "\n" +
                    "Produto: " + mult + "\n" +
                    "Divisão: " + div.toFixed(2) + "\n" +
                    "Resto: " + resto
                );
            }
        }
    </script>
</body>
</html>
